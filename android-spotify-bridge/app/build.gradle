plugins {
    id "com.android.application"
}

android {
    namespace "com.cyberdeck.spotifybridge"
    compileSdk 35

    defaultConfig {
        applicationId "com.cyberdeck.spotifybridge"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
